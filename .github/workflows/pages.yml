name: Deploy game to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: Cabinet compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      game-sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Check out candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out the real Commit Cabinet
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: filmgirl/arcade
          ref: 18b9d013a9591c9d97348f21023f875eb2a7630b
          path: .playwright-cabinet
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test gameplay
        run: npm test
      - name: Build candidate and test inside real cabinet
        run: |
          npm run build
          npm run test:cabinet
      - name: Prepare the tested public site
        id: digest
        run: |
          mkdir _site
          cp dist/mona-merge-maze.html _site/index.html
          echo "sha256=$(sha256sum _site/index.html | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload tested public site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cabinet-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  deploy:
    needs: compatibility
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy compatibility-tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  smoke:
    name: Published cabinet smoke
    needs: [compatibility, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out smoke tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install smoke runner
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check published build identity and gameplay
        env:
          EXPECTED_GAME_SHA256: ${{ needs.compatibility.outputs.game-sha256 }}
        run: npm run test:live
      - name: Upload published failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-smoke-failure
          path: test-results/
          if-no-files-found: ignore
